name: MediaBarExample
options:
  bundleIdPrefix: com.muilyzz
packages:
  ScoreLatticeKit:
    path: ../..
targets:
  MediaBarExample:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Sources]
    dependencies:
      - package: ScoreLatticeKit
        product: MediaAlign
      - package: ScoreLatticeKit
        product: PhraseLattice
      - package: ScoreLatticeKit
        product: PhraseLatticeUI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "6.0"
