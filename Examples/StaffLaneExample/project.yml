name: StaffLaneExample
options:
  bundleIdPrefix: com.muilyzz
packages:
  ScoreLatticeKit:
    path: ../..
targets:
  StaffLaneExample:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Sources]
    dependencies:
      - package: ScoreLatticeKit
        product: StaffLattice
      - package: ScoreLatticeKit
        product: PhraseLattice
      - package: ScoreLatticeKit
        product: PhraseLatticeUI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "6.0"
